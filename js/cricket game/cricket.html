<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="headings">
    <h1>Cricket Game</h1>
  </div>

  <div class="buttons">
    <button onclick="
    let computerchoice = computerChoice();
    let result = getResult(`Bat`, computerchoice);
    giveAlert(`Bat`, computerchoice, result);
  ">Bat</button>

  <button onclick="
    let computerchoice = computerChoice();
    let result = getResult(`Ball`, computerchoice);
    giveAlert(`Ball`, computerchoice, result);
  ">Ball</button>

  <button onclick="
    let computerchoice = computerChoice();
    let result = getResult(`Stump`, computerchoice);
    giveAlert(`Stump`, computerchoice, result);
  ">Stump</button>

  </div>

  <div class="clear">
    <button class="clearButton" onclick="
      localStorage.clear();
      score.Win = 0;
      score.Loss = 0;
      score.Draw = 0;
      ">clear</button>
  </div>
  
  <script>
    function computerChoice() {
      let choice = Math.floor(Math.random() * 3);
      if (choice > 0 && choice <= 1){
        return 'Bat';
      } else if (choice > 1 && choice <= 2) {
        return 'Ball';
      } else{
        return 'Stump';
      }
    }

    function getResult(userchoice, computerchoice){
      if (userchoice === `Bat`) {
        if (computerchoice === 'Bat') {
          score.Draw++ ;
          return 'Its draw';
        } else if (computerchoice === 'Ball'){
          score.Win++ ;
          return 'You won';
        } else {
          score.Loss++ ;
          return 'You lost';
        }
      } else if (userchoice === `Ball`) {
        if (computerchoice === 'Bat') {
          score.Loss++ ;
          return 'You lost';
        } else if (computerchoice === 'Ball'){
          score.Draw++ ;
          return 'Its draw';
        } else {
          score.Win++ ;
          return 'You won';
        }
      } else {
        if (computerchoice === 'Bat') {
          score.Win++ ;
          return 'You won';
        } else if (computerchoice === 'Ball'){
          score.Loss++ ;
          return 'You lost';
        } else {
          score.Draw++ ;
          return 'Its draw';
        }
      }
    }

    function giveAlert(userchoice, computerchoice, result){
      localStorage.setItem('score', JSON.stringify(score));
      alert(`User's choice is ${userchoice}, Computer's choice is ${computerchoice}
${result}
${score.displayScore()}`);
      console.log(score);
    }

    let score = {
      Win: 0,
      Loss: 0,
      Draw: 0,

      displayScore: function() {
        return `Won: ${score.Win}, Loss: ${score.Loss}, Draw: ${score.Draw}`;
      }
    };

    let scstore = JSON.stringify(score);
    localStorage.setItem('score', scstore);
    console.log(localStorage.getItem('score'));
  </script>
</body>
</html>
