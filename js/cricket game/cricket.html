<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <button onclick="
    let computerchoice = computerChoice();
    let result = getResult(`Bat`, computerchoice);
    giveAlert(`Bat`, computerchoice, result);
  ">Bat</button>

  <button onclick="
    let computerchoice = computerChoice();
    let result = getResult(`Ball`, computerchoice);
    giveAlert(`Ball`, computerchoice, result);
  ">Ball</button>

  <button onclick="
    let computerchoice = computerChoice();
    let result = getResult(`Stump`, computerchoice);
    giveAlert(`Stump`, computerchoice, result);
  ">Stump</button>

  <script>
    function computerChoice() {
      let choice = Math.floor(Math.random() * 3);
      if (choice > 0 && choice <= 1){
        return 'Bat';
      } else if (choice > 1 && choice <= 2) {
        return 'Ball';
      } else{
        return 'Stump';
      }
    }

    function getResult(userchoice, computerchoice){
      if (userchoice === `Bat`) {
        if (computerchoice === 'Bat') {
          score.Draw++ ;
          return 'Its draw';
        } else if (computerchoice === 'Ball'){
          score.Win++ ;
          return 'You won';
        } else {
          score.Loss++ ;
          return 'You lost';
        }
      } else if (userchoice === `Ball`) {
        if (computerchoice === 'Bat') {
          score.Loss++ ;
          return 'You lost';
        } else if (computerchoice === 'Ball'){
          score.Draw++ ;
          return 'Its draw';
        } else {
          score.Win++ ;
          return 'You won';
        }
      } else {
        if (computerchoice === 'Bat') {
          score.Win++ ;
          return 'You won';
        } else if (computerchoice === 'Ball'){
          score.Loss++ ;
          return 'You lost';
        } else {
          score.Draw++ ;
          return 'Its draw';
        }
      }
    }

    function giveAlert(userchoice, computerchoice, result){
      alert(`User's choice is ${userchoice}, Computer's choice is ${computerchoice}, ${result}.`);

      console.log(score);
    }

    let score = {
      Win: 0,
      Loss: 0,
      Draw: 0 
    };
  </script>
</body>
</html>
