<!DOCTYPE html>
<html lang="en">
<head>
  <title>Myntra practice</title>
</head>
<body>
  <script>
    let product = {
      name: `Hoodie`,
      size: `M`,
      fit: `Relaxed`
    }
    console.log(typeof product);
    console.log(product);
    // let copyproduct = product;
    // console.log(product);
    // copyproduct.size = `S`;
    // copyproduct.fit = `Slim`;
    // console.log(product);
    let str = JSON.stringify(product);
    console.log(typeof str);
    console.log(str);
    
    let newproduct = JSON.parse(str);
    console.log(typeof newproduct);
    console.log(newproduct);
  </script>
</body>
</html>
